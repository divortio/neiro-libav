name: Neiro Libav Build

on:
  push:
    tags:
      - 'v*'
  repository_dispatch:
    types: [upstream-audio-decode-updated]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout neiro-libav
        uses: actions/checkout@v4
        with:
          path: src/neiro-libav

      - name: Checkout audio-decode-libav
        uses: actions/checkout@v4
        with:
          repository: divortio/audio-decode-libav
          path: src/audio-decode-libav

      - name: Checkout libav.js-audio
        uses: actions/checkout@v4
        with:
          repository: divortio/libav.js-audio
          path: src/libav.js-audio

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build libav.js-audio dependency
        run: cd src/libav.js-audio && bash build/sync_and_build.sh

      - name: Build audio-decode-libav dependency
        run: cd src/audio-decode-libav && bash build/sync_and_build.sh

      - name: Build custom Neiro library
        run: cd src/neiro-libav && bash build/sync_and_build.sh

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: neiro-libav-build
          path: src/neiro-libav/dist/*.zip

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: src/neiro-libav/dist/*.zip
          generate_release_notes: true
